; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Environment used by VS Code Build/Upload: Teensy 4.0 with Arduino APIs.
; Firmware entry point is src/main.cpp; local headers are in include/.
; This configuration does not build the desktop analysis/tests executable.
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
; Serial Monitor setting matching Serial.begin(). USB serial is selected
; explicitly below; these settings do not change the 1000 ms sampling rate.
monitor_speed = 115200
build_flags = -D USB_SERIAL
; Sensor drivers fetched by PlatformIO. Wire, SPI, SD, and Arduino APIs
; come from the Teensy framework. Versions here are not pinned, so preserve
; build/dependency versions with experimental results for reproducibility.
lib_deps =
    robtillaart/MS5611
    adafruit/Adafruit MPU6050